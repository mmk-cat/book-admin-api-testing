[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --alluredir=reports/allure-results --clean-alluredir --html=reports/pytest-report.html --self-contained-html --junitxml=reports/junit.xml
junit_family = xunit2
markers =
    smoke: 核心冒烟用例
    negative: 逆向/异常用例
    auth: 认证与鉴权
    book: 图书接口
    borrow: 借阅接口
    contract: 响应契约
    db: 落库/数据库校验
    framework: 框架自检（不计入接口用例统计）
log_cli = false
