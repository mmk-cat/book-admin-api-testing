services:
  mysql:
    image: mysql:8.4
    container_name: book-admin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd
      MYSQL_DATABASE: book_admin
      MYSQL_USER: book_admin
      MYSQL_PASSWORD: book_admin_pwd
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pwd"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  api:
    build: .
    container_name: book-admin-api
    environment:
      DB_BACKEND: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: book_admin
      MYSQL_PASSWORD: book_admin_pwd
      MYSQL_DATABASE: book_admin
      TOKEN_SECRET: book-admin-demo-secret
      APP_HOST: 0.0.0.0
      APP_PORT: "5001"
      SEED_DEMO_DATA: "true"
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
